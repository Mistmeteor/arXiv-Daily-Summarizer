name: Daily arXiv Paper Digest

on:
  schedule:
    # 21:43 UTC = 05:43 Beijing Time (next day). Fires ~2 hours ahead of the
    # 08:00 Beijing "morning read" target so GitHub Actions cron delays (often
    # 10-60 min, worst at the top of the hour) plus arXiv fetch + DeepSeek
    # summarization (~5-15 min for 10 papers) still land the email before ~7am.
    - cron: '43 21 * * *'
  
  # Allow manual workflow trigger
  workflow_dispatch:

jobs:
  fetch-and-send:
    runs-on: ubuntu-latest
    permissions:
      # Needed so the workflow can commit pushed_papers.json back to the repo
      contents: write

    steps:
      # 1. Checkout code
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Python environment
      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # 3. Install dependencies
      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Run the paper digest script
      - name: 🚀 Run Paper Digest Script
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
        run: |
          python fetch_papers.py

      # 5. Persist push history so tomorrow's run knows what was already sent.
      #    Skips the commit cleanly when nothing changed.
      - name: 💾 Commit push history
        if: always()
        run: |
          if [ ! -f pushed_papers.json ]; then
            echo "No pushed_papers.json to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pushed_papers.json
          if git diff --cached --quiet; then
            echo "pushed_papers.json unchanged; nothing to commit."
            exit 0
          fi
          git commit -m "chore: update pushed_papers.json [skip ci]"
          git push
