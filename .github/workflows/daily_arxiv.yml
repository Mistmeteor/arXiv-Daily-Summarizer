name: Daily arXiv Paper Digest

on:
  schedule:
    # 21:43 UTC = 05:43 Beijing Time (next day). Fires ~2 hours ahead of the
    # 08:00 Beijing "morning read" target so GitHub Actions cron delays (often
    # 10-60 min, worst at the top of the hour) plus arXiv fetch + DeepSeek
    # summarization (~5-15 min for 10 papers) still land the email before ~7am.
    - cron: '43 21 * * *'
  
  # Allow manual workflow trigger
  workflow_dispatch:

jobs:
  fetch-and-send:
    runs-on: ubuntu-latest
    permissions:
      # Needed so the workflow can commit pushed_papers.json back to the repo
      contents: write

    steps:
      # 1. Checkout code
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Python environment
      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # 3. Install dependencies
      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Run the paper digest script
      - name: 🚀 Run Paper Digest Script
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          # Summary style: 'academic' (original) or 'plain' (easy-to-read).
          # Flip via repo → Settings → Secrets and variables → Actions → Variables,
          # add/edit a repository variable named SUMMARY_STYLE. Defaults to 'academic'.
          SUMMARY_STYLE: ${{ vars.SUMMARY_STYLE || 'academic' }}
        run: |
          python fetch_papers.py

      # 5. Persist push history + econ.EM backlog so tomorrow's run knows what
      #    was already sent and has a cushion of recent econ.EM papers to draw
      #    from if arXiv's export API rate-limits us. Skips cleanly if neither
      #    file changed.
      - name: 💾 Commit state files
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          staged=0
          for f in pushed_papers.json econ_backlog.json; do
            if [ -f "$f" ]; then
              git add "$f"
              staged=1
            fi
          done
          if [ "$staged" = "0" ]; then
            echo "No state files to commit."
            exit 0
          fi
          if git diff --cached --quiet; then
            echo "State files unchanged; nothing to commit."
            exit 0
          fi
          git commit -m "chore: update push history + econ backlog [skip ci]"
          git push
